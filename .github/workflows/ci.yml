name: 自检

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  check:
    name: 语法与清单自检（Node ${{ matrix.node }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 插件本身无 npm 依赖，主要验证多平台/多版本下的加载行为
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 运行自检
        run: node scripts/check.mjs

      - name: 直接语法检查全部 JS
        shell: bash
        run: |
          set -e
          for f in $(find lib scripts -name '*.js' -o -name '*.mjs'); do
            echo "--check $f"
            node --check "$f"
          done
